# Job único del proyecto. Cada área agrega aquí su tarea con depends_on:
#   ingesta -> calidad (depends_on: ingesta) -> metrica_1 y metrica_2 (depends_on: calidad)
#   -> verificar_metricas (depends_on: metrica_1 y metrica_2)
# DABs no permite repartir las tareas de un mismo job en varios archivos.
#
# Convenciones para las tareas que se agreguen:
#   - Código en src/<area>/ : lógica en módulos importables + un notebook delgado de entrada.
#   - Catálogo y esquema llegan como parámetros del job (widgets `catalogo` y `esquema`);
#     ninguna tarea escribe nombres fijos.
#   - Tareas SQL: warehouse_id: ${var.warehouse_id}
#   - Sin clúster: todas las tareas corren en serverless.

resources:
  jobs:
    pipeline_talento:
      name: pipeline_talento
      description: >-
        Pipeline de talento humano: ingesta incremental de los CSV del Volume landing a
        las tablas bronce; luego calidad (plata y cuarentena) y métricas (oro).

      # STANDARD: batch diario sin plazo de entrega; más barato que PERFORMANCE_OPTIMIZED.
      performance_target: STANDARD

      # Una sola corrida a la vez: dos corridas sobre el mismo checkpoint chocarían.
      max_concurrent_runs: 1
      timeout_seconds: 3600

      # Diario a las 06:00 UTC. En dev el modo development la deja pausada;
      # en prod el target la activa (pause_status: UNPAUSED).
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC

      parameters:
        - name: catalogo
          default: ${var.catalogo}
        - name: esquema
          default: ${var.esquema}

      tags:
        proyecto: prueba_tecnica

      tasks:
        - task_key: ingesta
          description: >-
            Auto Loader (availableNow) de landing/<entidad>/ a bronce_<entidad>.
            Solo procesa archivos nuevos; repetirla sin archivos nuevos no escribe nada.
          notebook_task:
            notebook_path: ../src/ingesta/cargar_bronce.py

        - task_key: calidad
          description: >-
            Reglas de la Sección 2 sobre las filas bronce nuevas: las válidas a plata_<entidad>
            y las demás a cuarentena con todos sus motivos. La unicidad del id se revisa
            contra toda la historia. Repetirla sin filas nuevas no escribe nada. Falla si
            alguna fila bronce queda sin destino o en plata y cuarentena a la vez.
          depends_on:
            - task_key: ingesta
          notebook_task:
            notebook_path: ../src/calidad/cargar_plata.py

        # Métricas (Sección 3): archivos SQL en el warehouse. `catalogo` y `esquema` llegan
        # solos desde los parámetros del job (marcadores :catalogo y :esquema). `prefijo`
        # es vacío aquí; las pruebas corren los mismos archivos con test_<sufijo>_.
        - task_key: metrica_1
          description: >-
            Reconstruye oro_contratados_trimestre_2021 (contratados en 2021 por departamento,
            cargo y trimestre, en UTC) y su vista _ordenada. Repetirla deja lo mismo.
          depends_on:
            - task_key: calidad
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/metricas/metrica_1.sql
            parameters:
              prefijo: ""

        - task_key: metrica_2
          description: >-
            Reconstruye oro_departamentos_sobre_promedio_2021 (departamentos que contrataron
            en 2021 estrictamente más que el promedio de todos) y su vista _ordenada.
          depends_on:
            - task_key: calidad
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/metricas/metrica_2.sql
            parameters:
              prefijo: ""

        - task_key: verificar_metricas
          description: >-
            Falla si la suma de Q1 a Q4 no da el total de 2021, si hay empleados sin
            departamento o cargo en plata, o si un cálculo alterno no coincide con las tablas.
          depends_on:
            - task_key: metrica_1
            - task_key: metrica_2
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/metricas/verificar_metricas.sql
            parameters:
              prefijo: ""
